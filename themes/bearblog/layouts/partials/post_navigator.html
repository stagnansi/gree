<div style="display:flex;gap:16px;justify-content:center;">
  <span>
    <span style="font-family: var(--font-main);">←&emsp;</span>{{ if .PrevInSection }}
    <a href="{{ .PrevInSection.Permalink }}">Prev Post</a>{{ else }}Prev Post{{ end }}
  </span>
  <span>|</span>
  <span>{{ if .NextInSection }}
    <a href="{{ .NextInSection.Permalink }}">Next Post</a>{{ else }}Next Post{{ end }}
    <span style="font-family: var(--font-main);">&emsp;→</span>
  </span>
</div>
