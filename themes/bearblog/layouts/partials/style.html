<style>
:root {
    --width: 720px;
    --font-main: ui-monospace, SFMono-Regular, "IBM Plex Mono", monospace;
    --font-secondary: ui-monospace, SFMono-Regular, "IBM Plex Mono", monospace;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #000;
    --text-color: #222;
    --link-color: #0000ff;
    --visited-color:  #0000ff;
    --code-background-color: #f2f2f2;
    --code-color: #000;
    --blockquote-color: #000;
}

body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
}

h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
}

a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
}

a:hover {
    text-decoration: underline; 
}

nav a {
    margin-right: 8px;
}

nav {
    line-height: 0.9;
}

strong, b {
    color: var(--heading-color);
}

button {
    margin: 0;
    cursor: pointer;
}

time {
  font-family: var(--font-secondary);
  font-style: normal;
  font-size: 15px;
}

main {
    line-height: 1.6;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px dashed var(--text-color);
    vertical-align: top;
    padding: 3px 6px;
}

hr {
    border: 0;
    border-top: 1px dashed var(--text-color);
}

img {
    max-width: 100%;
    -webkit-user-drag: none;
    user-select: none;
}

code {
    font-family: var(--font-main);
    padding: 3px 0px;
    background-color: var(--code-background-color);
    color: var(--code-color);
    border-radius: 0px;
}

blockquote {
    border-left: 1px dashed var(--text-color);
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: normal;
}

footer {
    padding: 0;
    text-align: left;
    display: block;
    margin-top: -10px;
}

.title:hover {
    text-decoration: none;
}

.title h2 {
    margin-bottom: -3px;
}

.inline {
    width: auto !important;
}

.highlight, .code {
    padding: 1px 15px;
    background-color: var(--code-background-color);
    color: var(--code-color);
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
}

/* blog post list */
ul.blog-posts {
    list-style-type: none;
    padding: unset;
}

ul.blog-posts li {
    display: flex;
}

ul.blog-posts li span {
    flex: 0 0 130px;
}

ul.blog-posts li a:visited {
    color: var(--visited-color);
}

/* Custom */
/* Kaomoji animation sama dengan Temp */
.ac-kao::after {
  content: "(;; •_•)";
  animation: kaoCycleSantai 3.2s infinite steps(1);
}

@keyframes kaoCycleSantai {
  0%,
  24% {
    content: "(;;•_•)";
  } /* 30°C */
  25%,
  49% {
    content: "(·_·; )";
  } /* 26°C */
  50%,
  74% {
    content: "(-_-; )";
  } /* 21°C */
  75%,
  99% {
    content: "(*^-^)b";
  } /* 16°C */
  100% {
    content: "(;;•_•)";
  }
}

/* Temp animation sama dengan Kaomoji */
.ac-temp {
  font-variant-numeric: tabular-nums;
  min-width: 3.8ch;
  text-align: right;
}

.ac-temp::after {
  content: "30°C";
  animation: tempCycleSantai 3.2s infinite steps(1);
}

@keyframes tempCycleSantai {
  0%,
  24% {
    content: "30°C";
  }
  25%,
  49% {
    content: "26°C";
  }
  50%,
  74% {
    content: "21°C";
  }
  75%,
  99% {
    content: "16°C";
  }
  100% {
    content: "30°C";
  }
}

/* Rotor */
.rotor {
  position: relative !important;
  top: -1px !important;
  display: inline-block !important;
  vertical-align: middle !important;
  width: 16px !important;
  height: 16px !important;
  animation: pureCssSpin 1.6s linear infinite;
  transform-origin: 8px 8px !important;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  will-change: transform; /* Kunci permanen layer GPU Safari */
}

/* Bilah Rotor */
.rotor span, .rotor::before, .rotor::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 7px;
  width: 2px;                /* Ketebalan bilah */
  height: 12px;              /* Panjang bilah */
  background-color: currentColor;
  transform-origin: 1px 6px;
}

/* Bilah 1: Vertikal (0°) */
.rotor span {
  transform: rotate(0deg);
}

/* Bilah 2: Diagonal Kanan (60°) */
.rotor::before {
  transform: rotate(60deg);
}

/* Bilah 3: Diagonal Kiri (120°) */
.rotor::after {
  transform: rotate(120deg);
}

@keyframes pureCssSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

/* Made in China, Loved by the World */
.proud {
  display: inline-block;
  position: relative;
  top: -3px;
  font-weight: 100;
}

/* Keadaan Tertutup (Menghadap Kanan) */
details summary {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  cursor: pointer;
  font-weight: bold;
  list-style: none;
}

details summary::-webkit-details-marker {
  display: none;
}

details summary::before {
  content: "▶";
  display: inline-block;
  flex-shrink: 0;
  line-height: inherit;
  transition: transform 0.15s ease; /* Transisi putaran cepat */
}

/* Keadaan Terbuka / Expand (Menghadap ke Bawah) */
details[open] > summary::before {
  transform: rotate(90deg);
}

/* 1. Atasi judul: rapatkan antar-baris DAN rapatkan ke tanggal */
h1 {
  line-height: 1 !important;     /* Merapatkan baris 1 dan baris 2 judul (default tema biasanya 1.4 - 1.5) */
  margin-bottom: 3px !important; /* Menarik teks tanggal di bawahnya agar mendekat */
}

h2, h3 {
    line-height: 1.15 !important;
}

/* 1. Link Navigasi: Flexbox Murni + Teks Stretch Vertikal */
.nav-item a {
  flex: 1;
  display: flex;                    /* KUNCI: Pertahankan flex, hapus inline-block */
  align-items: center;              /* Vertikal rata tengah (middle) */
  justify-content: flex-start;
  margin: 0;
  font-weight: bold;
  white-space: nowrap;
  text-decoration: none;
  
  /* Efek stretch vertikal tetap aman bekerja di flex container */
  transform: scaleY(1.2);
  transform-origin: center center;
}

/* 2. Panah Dinamis Menempel Presisi di ']' */
.nav-item a::after {
  content: "";
  flex: 1;                          /* Menghisap ruang sisa dari teks hingga ']' */
  height: 8px;                      /* Tinggi kepala panah */
  margin-left: 1ch;                 /* Jeda tepat 1 spasi monospace dari kata */
  background-color: currentColor;   /* Warna konsisten dengan teks link */
  
  /* Dukungan penuh WebKit (Safari iOS) & Browser Standar */
  -webkit-clip-path: polygon(
    0 calc(50% - 1px),                /* Batang: kiri atas (tebal 2px) */
    calc(100% - 5px) calc(50% - 1px), /* Batang: kanan atas */
    calc(100% - 5px) 0,               /* Sayap atas */
    100% 50%,                         /* Ujung runcing pas di bibir ']' */
    calc(100% - 5px) 100%,            /* Sayap bawah */
    calc(100% - 5px) calc(50% + 1px), /* Batang: kanan bawah */
    0 calc(50% + 1px)                 /* Batang: kiri bawah */
  );
  clip-path: polygon(
    0 calc(50% - 1px),
    calc(100% - 5px) calc(50% - 1px),
    calc(100% - 5px) 0,
    100% 50%,
    calc(100% - 5px) 100%,
    calc(100% - 5px) calc(50% + 1px),
    0 calc(50% + 1px)
  );
}

/* 2. Layar Tablet / iPad Mini / Landscape Phone: 4 Kolom */
@media (max-width: 660px) {
  .nav-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 10px 10px;
  }
}

/* 3. Layar Ponsel Sedang / Lebar (iPhone Pro Max, Android lega): 3 Kolom */
@media (max-width: 540px) {
  .nav-grid {
    grid-template-columns: repeat(3, 1fr);
    row-gap: 4px !important;/* KUNCI: Baris atas-bawah langsung dirapatkan */
    column-gap: 8px;        /* Jarak kiri-kanan tetap aman */
    font-size: 0.92em;
    line-height: 1;
  }
  .nav-item {
    line-height: 1;
  }
  .nav-item a {
    padding: 2px 0;         /* Bantalan sentuh tipis agar tidak renggang */
  }
}

/* 4. Layar Ponsel Compact (iPhone SE 3 [375px], Mini series): 2 Kolom */
@media (max-width: 400px) {
  .nav-grid {
    grid-template-columns: repeat(2, 1fr);
    row-gap: 4px !important;        /* Tetap rapat, menghilangkan jurang kosong */
    column-gap: 8px;
    font-size: 1.1em;
    line-height: 1;
  }
  .nav-item {
    line-height: 1;
  }
  .nav-item a {
    padding: 3px 0;
  }
}

ul {
  list-style-type: "— ";
  padding-left: 1.5em;
}

.kurung {
    user-select: none;
    font-weight: 600;
}
</style>
