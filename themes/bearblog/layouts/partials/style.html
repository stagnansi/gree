<style>
:root {
    --width: 720px;
    --font-main: ui-monospace, SFMono-Regular, "IBM Plex Mono", monospace;
    --font-secondary: ui-monospace, SFMono-Regular, "IBM Plex Mono", monospace;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #000;
    --text-color: #222;
    --link-color: #0000ff;
    --visited-color:  #0000ff;
    --code-background-color: #f2f2f2;
    --code-color: #000;
    --blockquote-color: #000;
}

body {
  font-family: var(--font-secondary);
  font-size: var(--font-scale);
  margin: auto;
  padding: 20px;
  max-width: var(--width);
  text-align: left;
  background-color: var(--background-color);
  word-wrap: break-word;
  overflow-wrap: break-word;
  line-height: 1.5;
  color: var(--text-color);
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-main);
  color: var(--heading-color);
}

a {
  color: var(--link-color);
  cursor: pointer;
  text-decoration: none;
}

a:hover {
  text-decoration: underline; 
}

nav a {
  margin-right: 8px;
}

nav {
  line-height: 0.9;
}

strong, b {
  color: var(--heading-color);
}

button {
  margin: 0;
  cursor: pointer;
}

time {
  font-family: var(--font-secondary);
  font-style: normal;
  font-size: 15px;
}

main {
  line-height: 1.6;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px dashed var(--text-color);
  vertical-align: top;
  padding: 3px 6px;
}

hr {
  border: 0;
  border-top: 1px dashed var(--text-color);
}

img {
  max-width: 100%;
  -webkit-user-drag: none;
  user-select: none;
}

code {
  font-family: var(--font-main);
  padding: 3px 0px;
  background-color: var(--code-background-color);
  color: var(--code-color);
  border-radius: 0px;
}

blockquote {
  border-left: 1px dashed var(--text-color);
  color: var(--blockquote-color);
  padding-left: 20px;
  font-style: normal;
}

footer {
  padding: 0;
  text-align: left;
  display: block;
  margin-top: -10px;
  margin-bottom: -30px;
}

.title:hover {
  text-decoration: none;
}

.title h2 {
  margin-bottom: -3px;
}

.inline {
  width: auto !important;
}

.highlight, .code {
  padding: 1px 15px;
  background-color: var(--code-background-color);
  color: var(--code-color);
  border-radius: 0px;
  margin-block-start: 1em;
  margin-block-end: 1em;
  overflow-x: auto;
}

/* blog post list */
ul.blog-posts {
  list-style-type: none;
  padding: unset;
}

ul.blog-posts li {
  display: flex;
}

ul.blog-posts li span {
  flex: 0 0 130px;
}

ul.blog-posts li a:visited {
  color: var(--visited-color);
}

/* custom */
/* kaomoji */
.ac-kao::after {
  content: "(;; •_•)";
  animation: kaoCycleSantai 3.2s infinite steps(1);
}

@keyframes kaoCycleSantai {
  0%,
  24% {
    content: "(;;•_•)";
  } /* 30°C */
  25%,
  49% {
    content: "(·_·; )";
  } /* 26°C */
  50%,
  74% {
    content: "(-_-; )";
  } /* 21°C */
  75%,
  99% {
    content: "(*^-^)b";
  } /* 16°C */
  100% {
    content: "(;;•_•)";
  }
}

/* temp */
.ac-temp {
  font-variant-numeric: tabular-nums;
  min-width: 3.8ch;
  text-align: right;
}

.ac-temp::after {
  content: "30°C";
  animation: tempCycleSantai 3.2s infinite steps(1);
}

@keyframes tempCycleSantai {
  0%,
  24% {
    content: "30°C";
  }
  25%,
  49% {
    content: "26°C";
  }
  50%,
  74% {
    content: "21°C";
  }
  75%,
  99% {
    content: "16°C";
  }
  100% {
    content: "30°C";
  }
}

/* rotor */
.rotor {
  position: relative !important;
  top: -1px !important;
  display: inline-block !important;
  vertical-align: middle !important;
  width: 16px !important;
  height: 16px !important;
  animation: pureCssSpin 1.6s linear infinite;
  transform-origin: 8px 8px !important;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  will-change: transform;
}

/* bilah rotor */
.rotor span, .rotor::before, .rotor::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 7px;
  width: 2px; /* tebal */
  height: 12px; /* panjang */
  background-color: currentColor;
  transform-origin: 1px 6px;
}

/* bilah 1 */
.rotor span {
  transform: rotate(0deg);
}

/* bilah 2 */
.rotor::before {
  transform: rotate(60deg);
}

/* bilah 3 */
.rotor::after {
  transform: rotate(120deg);
}

@keyframes pureCssSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

/* made in china, loved by the world. */
.proud {
  display: inline-block;
  position: relative;
  top: -3px;
  font-weight: 100;
}

/* details summary */
details summary {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  cursor: pointer;
  font-weight: bold;
  list-style: none;
  -webkit-user-select: none;
  user-select: none;
}

details summary:hover {
  text-decoration: underline;
}

details summary::-webkit-details-marker {
  display: none;
}

/* triangle */
details summary::before {
  content: "";
  display: inline-block;
  width: 9px;
  height: 11px;
  margin-top: 0.28em;
  flex-shrink: 0;
  background-color: currentColor;
  -webkit-clip-path: polygon(0 0, 100% 50%, 0 100%);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
  transition: transform 0.15s ease;
  transform-origin: center center;
}

details[open] > summary::before {
  transform: rotate(90deg);
}

/* judul blog */
h1 {
  line-height: 1 !important;
  margin-bottom: 3px !important;
}

h2, h3 {
  line-height: 1.15 !important;
}

/* navigation */
.nav-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* Default PC: 4 Kolom (Pas 3 baris simetris) */
  gap: 10px 14px;
  width: 100%;
  box-sizing: border-box;
}

.nav-item {
  display: flex;
  align-items: center;
  width: 100%;
}

.nav-item a {
  flex: 1;
  display: flex;
  align-items: center;
  margin: 0;
  padding: 0;
  white-space: nowrap;
  text-decoration: none;

  /* Stretch vertical */
  transform: scaleY(1.2);
  transform-origin: center center;
}

/* Garis dashed dinamis penghubung menu */
.nav-item a::after {
  content: "";
  flex: 1;
  height: 0;
  border-bottom: 1px dashed var(--text-color); /* atau ganti ke var(--border-color) jika hr lebih redup */
  margin-left: 0.5ch;
}

.nav-item a:hover {
  text-decoration: underline;
}

/* 3 kolom (Tablet / Ponsel Lebar) */
@media (max-width: 620px) {
  .nav-grid {
    grid-template-columns: repeat(3, 1fr);
    row-gap: 5px !important;
    column-gap: 8px;
    font-size: 0.92em;
    line-height: 1;
  }

  .nav-item {
    line-height: 1;
  }

  .nav-item a {
    padding: 2px 0;
  }
}

/* 2 kolom (Ponsel Standar) */
@media (max-width: 420px) {
  .nav-grid {
    grid-template-columns: repeat(2, 1fr);
    row-gap: 4px !important;
    column-gap: 8px;
    font-size: 1.05em;
    line-height: 1;
  }

  .nav-item {
    line-height: 1;
  }

  .nav-item a {
    padding: 3px 0;
  }
}

ul {
  list-style-type: "— ";
  padding-left: 1.5em;
}

.kurung {
  user-select: none;
  font-weight: normal;
}

.select {
  user-select: none;
}

.br {
  margin-bottom: -0.2em;
}

/* youtube */
iframe[src*="youtube.com"] {
  width: 100%;
  max-width: 720px;
  height: auto;
  aspect-ratio: 16 / 9;
  display: block;
  margin: 1.5em 0;
  border: 0;
}
</style>
