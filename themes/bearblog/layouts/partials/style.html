<style>
:root {
    --width: 720px;
    --font-main: "IBM Plex Mono", sans-serif;
    --font-secondary: "IBM Plex Mono", sans-serif;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #000;
    --text-color: #222;
    --link-color: #0000ff;
    --visited-color:  #0000ff;
    --code-background-color: #f2f2f2;
    --code-color: #000;
    --blockquote-color: #000;
}

body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
}

h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
}

a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
}

a:hover {
    text-decoration: underline; 
}

nav a {
    margin-right: 8px;
}

strong, b {
    color: var(--heading-color);
}

button {
    margin: 0;
    cursor: pointer;
}

time {
  font-family: var(--font-secondary);
  font-style: normal;
  font-size: 15px;
}

main {
    line-height: 1.6;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px dashed var(--text-color);
    vertical-align: top;
    padding: 3px 6px;
}

hr {
    border: 0;
    border-top: 1px dashed var(--text-color);
}

img {
    max-width: 100%;
}

code {
    font-family: var(--font-main);
    padding: 3px 6px;
    background-color: var(--code-background-color);
    color: var(--code-color);
    border-radius: 0px;
}

blockquote {
    border-left: 1px dashed var(--text-color);
    color: var(--code-color);
    padding-left: 20px;
    font-style: normal;
}

footer {
    padding: 0;
    text-align: left;
    display: inline-block;
    position: relative;
    top: -25px;
}

.title:hover {
    text-decoration: none;
}

.title h2 {
    margin-bottom: -3px;
}

.inline {
    width: auto !important;
}

.highlight, .code {
    padding: 1px 15px;
    background-color: var(--code-background-color);
    color: var(--code-color);
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
}

/* blog post list */
ul.blog-posts {
    list-style-type: none;
    padding: unset;
}

ul.blog-posts li {
    display: flex;
}

ul.blog-posts li span {
    flex: 0 0 130px;
}

ul.blog-posts li a:visited {
    color: var(--visited-color);
}

/* Custom */
/* Kaomoji: Durasi Santai 3.2s Sinkron dengan Suhu */
.ac-kao::after {
  content: "(;; •_•)";
  animation: kaoCycleSantai 3.2s infinite steps(1);
}

@keyframes kaoCycleSantai {
  0%,
  24% {
    content: "(;;•_•)";
  } /* 30°C: Gerah berkeringat */
  25%,
  49% {
    content: "(·_·; )";
  } /* 26°C: Mulai berhembus */
  50%,
  74% {
    content: "(-_-; )";
  } /* 21°C: Udara dingin menyelimuti */
  75%,
  99% {
    content: "(*^-^)b";
  } /* 16°C: Sejuk stabil, jempol mantap */
  100% {
    content: "(;;•_•)";
  }
}

/* Suhu: Durasi Santai 3.2s (4-Phase Jump) */
.ac-temp {
  font-variant-numeric: tabular-nums;
  min-width: 3.8ch;
  text-align: right;
}

.ac-temp::after {
  content: "30°C";
  animation: tempCycleSantai 3.2s infinite steps(1);
}

@keyframes tempCycleSantai {
  0%,
  24% {
    content: "30°C";
  }
  25%,
  49% {
    content: "26°C";
  }
  50%,
  74% {
    content: "21°C";
  }
  75%,
  99% {
    content: "16°C";
  }
  100% {
    content: "30°C";
  }
}

/* Rotor */
.rotor {
  position: relative !important;
  top: 2px !important;
  width: 0.9em;
  height: 0.9em;
  display: inline-block;
  transform-origin: center center;
  animation: pureCssSpin 1.6s linear infinite;
  will-change: transform; /* Optimasi sub-pixel rendering agar tidak goyang */
}

.rotor span, .rotor::before, .rotor::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2.5px; /* Ketebalan bilah */
  height: 100%;
  background-color: currentColor;
  transform-origin: center center;
}

/* Bilah 1: Vertikal (0°) */
.rotor span {
  transform: translate(-50%, -50%) rotate(0deg);
}

/* Bilah 2: Diagonal Kanan (60°) */
.rotor::before {
  transform: translate(-50%, -50%) rotate(60deg);
}

/* Bilah 3: Diagonal Kiri (120°) */
.rotor::after {
  transform: translate(-50%, -50%) rotate(120deg);
}

@keyframes pureCssSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.proud {
  display: inline-block;
  position: relative;
  top: -3px;
  font-weight: 100;
}

summary {
  font-weight: bold;
}

details summary:hover {
  text-decoration: underline;
}

details summary {
  cursor: pointer;
}

/* 1. Atasi judul: rapatkan antar-baris DAN rapatkan ke tanggal */
h1 {
  line-height: 1 !important;     /* Merapatkan baris 1 dan baris 2 judul (default tema biasanya 1.4 - 1.5) */
  margin-bottom: 3px !important; /* Menarik teks tanggal di bawahnya agar mendekat */
}

h2 {
    line-height: 1.15!important;
}
</style>
