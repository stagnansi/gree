<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="preload" href="/fonts/noto-sans-sc-subset.woff2" as="font" type="font/woff2" crossorigin>
<style>
  :root {
    --font-main: InterDisplay, sans-serif;
    --font-secondary: Inter, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    font-feature-settings: 'liga' 1, 'calt' 1, 'zero' 1;
    font-variant-numeric: slashed-zero;
  }

  time {
    font-family: var(--font-mono);
  }
  
  @font-face {
    font-family: 'Noto Sans SC Subset';
    src: url('/fonts/noto-sans-sc-subset.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  .footer-plate {
    border: 1px solid #e0e0e0;
    border-radius: 3px;
    padding: 6px 10px;
    font-size: calc(var(--font-scale) * 0.8);
    color: #999;
    display: block;
    width: 100%;
    max-width: 240px;
    margin: 0 auto;
    box-sizing: border-box;
    text-align: left;
    line-height: 1.4;
    user-select: none;
    -webkit-user-select: none;
  }

  .footer-brand {
    font-size: 1.2em;
    color: #b0b0b0;
    font-weight: 900;
    font-style: italic;
  }

  .footer-fan {
    display: inline-block;
    animation: footer-spin 3s linear infinite;
    transform-origin: 50% 50%;
    color: #a5a5a5;
    font-size: 1.2em;
  }

  @keyframes footer-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .footer-divider {
    border-top: 1px dashed #e2e2e2;
    margin: 6px 0;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85em;
  }

  .footer-row span {
    line-height: 1;
  }

  .footer-mono {
    font-family: var(--font-mono);
  }

  .footer-slogan {
    text-align: center;
    font-family: 'Noto Sans SC Subset', var(--font-secondary);
    font-size: 0.95em;
    color: #b0b0b0;
    user-select: text;
    -webkit-user-select: text;
  }

  .footer-origin {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.75em;
    color: #ccc;
    margin-top: 3px;
    letter-spacing: 1.1px;
  }
  mark {
    background-color: #ffff00;
    color: inherit;
    padding: 1px 3px;
    border-radius: 2px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #fff;
      --heading-color: #222;
      --text-color: #444;
      --link-color: #3273dc;
      --visited-color: #8b6fcb;
      --blockquote-color: #222;
    }
  }
  .title h2 {
    font-weight: 900;
  }

  nav {
    display: grid;
    grid-template-columns: repeat(5, max-content);
    gap: 0 12px;
    justify-content: space-between;
  }

  nav a {
    margin-right: 0;
    white-space: nowrap;
  }

  .nav-item {
    display: flex;
    align-items: baseline;
  }

  .nav-arrow {
    color: var(--heading-color);
    margin-right: 0.35em;
    user-select: none;
    -webkit-user-select: none;
  }

  @media (max-width: 720px) {
    nav {
      grid-template-columns: repeat(4, max-content);
    }
  }

  @media (max-width: 620px) {
    nav {
      grid-template-columns: repeat(3, max-content);
    }
  }

  @media (max-width: 340px) {
    nav {
      grid-template-columns: repeat(2, max-content);
    }
  }

  blockquote {
    font-style: normal;
  }
  .emoji {
    user-select: none;
    -webkit-user-select: none;
  }

  .footer-back-to-top {
    text-align: center;
    margin-top: 2px;
  }

  .back-to-top {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--font-mono);
    font-size: 0.4em;
    color: #ccc;
    letter-spacing: 1.1px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  .back-to-top:hover {
    color: #999;
  }

  /* Tables: border + mono font */
  table {
    border-collapse: collapse;
    font-family: var(--font-mono);
  }
  table th,
  table td {
    border: 1px solid #ddd;
    padding: 4px 8px;
    text-align: left;
  }

  /* Code: IBM Plex Mono */
  code {
    font-family: var(--font-mono);
  }

  /* Code block: wrapper bg + padding 14px, pre di-reset (strut fix) */
  .highlight,
  .code {
    padding: 14px;
    box-sizing: border-box;
    background-color: #f0f0f0;
    border-radius: 0;
    overflow-y: hidden;
  }
  .highlight pre,
  .code pre {
    padding: 0;
    margin: 0;
    background-color: transparent !important;
    line-height: 0;
  }
  .highlight pre span,
  .code pre span {
    line-height: 1.4;
  }

  /* UL: arrow prefix (kecuali blog list) */
  main ul:not(.blog-posts) {
    list-style: none;
    padding-left: 0;
  }
  main ul:not(.blog-posts) > li {
    position: relative;
    padding-left: 1.4em;
  }
  main ul:not(.blog-posts) > li::before {
    content: '\2192';
    position: absolute;
    left: 0;
    color: var(--text-color);
  }
</style>
